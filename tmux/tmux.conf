# ═══════════════════════════════════════════════════════════════
#  tmux configuration
#
#  Managed declaratively by home-manager — see `programs.tmux`
#  in home.nix. Core options (prefix, vi mode, base-index, mouse,
#  focus-events, …) and tmux-sensible are emitted by home-manager
#  *before* this file. Plugins are installed by Nix and loaded
#  immediately *after* this file — there is no TPM.
#
#  To change anything: edit this file, run `make hm`, then press
#  <prefix> r to reload.
# ═══════════════════════════════════════════════════════════════

# ── Terminal ───────────────────────────────────────────────────
# True colour — modern "terminal-features" syntax (tmux 3.2+)
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*256col*:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Let cursor-shape escapes through so the neovim cursor is correct
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# ── Behaviour ──────────────────────────────────────────────────
set  -g renumber-windows on     # close a window, renumber the rest
set  -g display-time     2000   # keep status messages up for 2s
set  -g status-interval  10     # refresh the status line every 10s

# Window titles
set  -g set-titles       on
setw -g automatic-rename off
set  -g allow-rename     off

# Tell me about activity in background windows
setw -g monitor-activity on
set  -g visual-activity  on

# ── Key bindings ───────────────────────────────────────────────
# Reload this file (after `make hm` has regenerated it)
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits — open in the current pane's directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Select panes, vim-style (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle panes with prefix + Ctrl-a
bind C-a select-pane -t :.+

# Select panes with Alt+hjkl (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch windows with Shift+arrows (no prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Resize panes — coarse (prefix + Shift, repeatable)
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Resize panes — fine (prefix + Alt, repeatable)
bind -r M-j resize-pane -D
bind -r M-k resize-pane -U
bind -r M-h resize-pane -L
bind -r M-l resize-pane -R

# Fuzzy-jump to any window in any session, in a popup (needs fzf)
bind f display-popup -E -w 70% -h 60% \
  "tmux list-windows -a | fzf --reverse --prompt 'switch: ' | cut -d: -f1-2 | xargs -r tmux switch-client -t"

# Ctrl-h/j/k/l (seamless tmux <-> neovim pane navigation) are bound
# by the vim-tmux-navigator plugin, loaded after this file.

# ── Copy mode (vi) — Wayland clipboard ─────────────────────────
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Plugin settings ────────────────────────────────────────────
# The plugins themselves are installed by Nix and loaded right
# after this file — see `programs.tmux` in home.nix.

# resurrect — save/restore sessions, windows, panes and contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'

# continuum — auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore       'on'
set -g @continuum-save-interval '15'

# ── Gruvbox theme (muted) ──────────────────────────────────────
# Mostly gruvbox grays, like the shell prompt. Window tabs are
# pills — inactive on bg1, active on blue — and orange still flags
# activity. The rest of the status line stays restrained gray.
#   bg0 #282828   bg1 #3c3836   bg2 #504945
#   dim #665c54   gray #928374   fg4 #a89984   fg1 #ebdbb2
#   blue #83a598 (active tab)   orange #fe8019 (activity)

set -g status          on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=#282828,fg=#a89984"

# Left — session name
set -g status-left-length 40
set -g status-left "#[fg=#928374] #S #[fg=#665c54]│ "

# Windows — pill tabs: inactive sit on a dark pill (bg1), the active
# window wears a blue pill (#83a598) with dark, bold text. The index
# is tinted a shade away from the name so it reads as a label.
set -g window-status-separator " "
set -g window-status-format         "#[fg=#928374,bg=#3c3836] #I #[fg=#a89984]#W "
set -g window-status-current-format "#[fg=#282828,bg=#83a598,bold] #I #[fg=#1d2021]#W "
set -g window-status-activity-style "fg=#fe8019,bg=#3c3836"

# Right — battery · kube context · wakatime · connection · date
# The #{battery_*} tokens are substituted by the tmux-battery plugin.
set -g status-right-length 250
set -g status-right "#[fg=#928374] Batt #{battery_percentage} #{battery_remain} #[fg=#665c54]│ #[fg=#928374]#(~/.completions/tmux_kube.sh) #[fg=#665c54]│ #[fg=#928374]Wakatime #(cd ~/bin; uv run view.py today) #[fg=#665c54]│ #[fg=#928374]Conn #(cd ~/bin; uv run connection-checker.py --tmux) #[fg=#665c54]│ #[fg=#a89984]%a %d %b %H:%M "

# Panes — subtle borders, gray (not coloured) active border
set -g pane-border-style           "fg=#3c3836"
set -g pane-active-border-style    "fg=#a89984"
set -g display-panes-colour        "#504945"
set -g display-panes-active-colour "#a89984"

# Messages / command prompt
set -g message-style         "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Copy-mode selection highlight
set -g mode-style "bg=#504945,fg=#ebdbb2"

# Clock (prefix + t)
set -g clock-mode-colour "#a89984"
