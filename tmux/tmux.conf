# ═══════════════════════════════════════════════════════════════
#  tmux configuration
#
#  Managed declaratively by home-manager — see `programs.tmux`
#  in home.nix. Core options (prefix, vi mode, base-index, mouse,
#  focus-events, …) and tmux-sensible are emitted by home-manager
#  *before* this file. Plugins are installed by Nix and loaded
#  immediately *after* this file — there is no TPM.
#
#  To change anything: edit this file, run `make hm`, then press
#  <prefix> r to reload.
# ═══════════════════════════════════════════════════════════════

# ── Terminal ───────────────────────────────────────────────────
# True colour — modern "terminal-features" syntax (tmux 3.2+)
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*256col*:RGB"

# Ghostty. tmux ships no ghostty entry in its built-in feature table (still
# true in 3.7b), so xterm-ghostty falls through to the generic "xterm*" rule
# and gets clipboard/ccolour/cstyle/focus/title — nothing else. Its terminfo
# advertises considerably more (`infocmp -x xterm-ghostty`), but tmux only
# uses what it is told about, so name the capabilities here:
#
#   sync        Synchronized updates (DECSET 2026). Without it a repaint
#               reaches the terminal as a stream of partial writes and ghostty
#               renders the half-finished frames. Switching panes repaints the
#               borders and re-expands the status line, which is exactly when
#               that showed up as flicker.
#   usstyle     Smulx/Setulc — styled and coloured underlines, so neovim's
#               diagnostic undercurls draw as curls rather than flat lines.
#   hyperlinks  OSC 8 clickable links.
#   extkeys     Extended keys (CSI u), so modifier combinations ASCII cannot
#               distinguish reach the application. First one to drop if some
#               binding starts misbehaving.
#   osc7        Working-directory reporting; pairs with `shell-integration` in
#               ghostty/config.
#
# Features are resolved when a client attaches, so editing this needs a fresh
# terminal window. `<prefix> r` and even `tmux set -ag` on the running server
# will appear to do nothing — check with:
#   tmux display-message -p '#{client_termfeatures}'
set -as terminal-features ",xterm-ghostty:RGB:sync:usstyle:hyperlinks:extkeys:osc7"

# Let cursor-shape escapes through so the neovim cursor is correct
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# ── Environment ────────────────────────────────────────────────
# Do not hand home-manager's "already sourced" guard to panes. The server
# keeps the environment it was started with, guard included, so without this
# every new pane skips hm-session-vars.sh and is stuck with the PATH and
# session variables from the day the server started — a `make hm` that adds
# a PATH entry (homebrew, say) never reaches tmux until the server is killed.
# With the guard gone each new pane's login shell sources the current file.
set-environment -gu __HM_SESS_VARS_SOURCED

# ── Behaviour ──────────────────────────────────────────────────
set  -g renumber-windows on     # close a window, renumber the rest
set  -g display-time     2000   # keep status messages up for 2s
set  -g status-interval  10     # refresh the status line every 10s

# Window titles — name each window after the folder its active pane is in
# (~ for $HOME), so the tab says which project it is rather than "zsh". A
# trailing ".nosync" (the iCloud opt-out suffix) is dropped: dotfiles.nosync
# reads as "dotfiles".
# `prefix ,` still wins: a hand-set name switches automatic-rename off for
# that window. allow-rename stays off so programs cannot rename windows.
set  -g set-titles       on
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},~,#{s/[.]nosync$//:#{b:pane_current_path}}}"
set  -g allow-rename     off

# Tell me about activity in background windows
setw -g monitor-activity on
set  -g visual-activity  on

# ── Key bindings ───────────────────────────────────────────────
# Reload this file (after `make hm` has regenerated it)
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits — open in the current pane's directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Select panes, vim-style (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle panes with prefix + Ctrl-a
bind C-a select-pane -t :.+

# Select panes with Alt+hjkl (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch windows with Shift+arrows (no prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Resize panes — coarse (prefix + Shift, repeatable)
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Resize panes — fine (prefix + Alt, repeatable)
bind -r M-j resize-pane -D
bind -r M-k resize-pane -U
bind -r M-h resize-pane -L
bind -r M-l resize-pane -R

# Fuzzy-jump to any window in any session, in a popup (needs fzf)
bind f display-popup -E -w 70% -h 60% \
  "tmux list-windows -a | fzf --reverse --prompt 'switch: ' | cut -d: -f1-2 | xargs -r tmux switch-client -t"

# prefix + g — lazygit in a popup over the current pane, opened in that pane's
# directory. For reading what the agent in the pane has changed without
# leaving it or giving up a split; q closes it. (Replaces tmux 3.8's default
# prefix + g, the key table for moving floating panes; the same moves are
# still in the prefix + > menu.)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Ctrl-h/j/k/l (seamless tmux <-> neovim pane navigation) are bound
# by the vim-tmux-navigator plugin, loaded after this file.

# ── Copy mode (vi) ─────────────────────────────────────────────
# Per-platform helpers. copy-command is what a bare copy-pipe runs, so one
# setting covers y / Enter below *and* tmux's default mouse-drag binding. The
# bindings used to name wl-copy outright, which does not exist on the Mac.
# @open is the "open this URL or file" command used by O further down.
if-shell '[ "$(uname)" = Darwin ]' {
  set -s copy-command "pbcopy"
  set -g @open "open"
} {
  set -s copy-command "wl-copy"
  set -g @open "xdg-open"
}

bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# prefix + / — enter copy mode already searching upwards, incrementally: the
# view follows as you type. Saves the `prefix [` then `?` two-step. (Replaces
# tmux's default prefix + /, "describe key".) n / N walk the matches.
bind / copy-mode \; command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }

# u — jump to the previous URL in the scrollback; n / N for the next ones.
bind -T copy-mode-vi u send-keys -X search-backward "https?://[^[:space:]\"'<>]+"

# O — open what is selected, or failing that the current search match (so
# `u` then `O` opens a URL without selecting anything).
# The match comes from pane output, which is not trusted, and run-shell hands
# it to sh. It goes inside single quotes, where sh expands nothing, and a
# match that itself contains a single quote is refused rather than escaped.
bind -T copy-mode-vi O if-shell -F "#{selection_present}" {
  send-keys -FX copy-pipe-and-cancel "xargs #{@open}"
} {
  if-shell -F "#{&&:#{search_present},#{!:#{m:*'*,#{search_match}}}}" {
    run-shell "#{@open} '#{search_match}'"
  } {
    display-message "nothing to open: select something, or press u to find a URL"
  }
}

# Line numbers in the gutter, counted from the top of the scrollback. They are
# what makes `:` usable: with numbers off, goto-line counts lines up from the
# *bottom*, against a numbering nothing on screen shows. `hybrid` (current
# line absolute, the rest relative, for 12k-style moves) is the alternative.
set -g copy-mode-line-numbers absolute

# : — go to a line and put the cursor on it. Stock goto-line only scrolls the
# view so the line sits on the top row and leaves the cursor where it was, so
# follow it with top-line. A line in the last screenful cannot be scrolled to
# the top; there the cursor walks down the remaining rows instead.
bind -T copy-mode-vi : command-prompt -P -p "(goto line)" {
  send-keys -X goto-line -- "%%"
  send-keys -X top-line
  if-shell -F "#{e|>:%%,#{e|+:#{history_size},1}}" {
    run-shell -C "send-keys -X -N #{e|-:#{e|-:%%,#{history_size}},1} cursor-down"
  }
}

# prefix + e — the pane's whole scrollback in nvim, in a new window, cursor at
# the end. For when the thing to find or copy wants real editor motions; :q
# closes the window and removes the temp file. -J rejoins wrapped lines.
bind e run-shell 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX") && tmux capture-pane -pJ -S - -t "#{pane_id}" > "$f" && tmux new-window -n scrollback "nvim + \"$f\"; rm -f \"$f\""'

# ── Plugin settings ────────────────────────────────────────────
# The plugins themselves are installed by Nix and loaded right
# after this file — see `programs.tmux` in home.nix.

# resurrect — save/restore sessions, windows, panes and contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'

# continuum — auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore       'on'
set -g @continuum-save-interval '15'

# ── Gruvbox theme (muted) ──────────────────────────────────────
# Mostly gruvbox grays, like the shell prompt. Window tabs are
# pills — inactive on bg1, active on blue — and orange still flags
# activity. The rest of the status line stays restrained gray.
#   bg0 #282828   bg1 #3c3836   bg2 #504945
#   dim #665c54   gray #928374   fg4 #a89984   fg1 #ebdbb2
#   blue #83a598 (active tab)   orange #fe8019 (activity)

set -g status          on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=#282828,fg=#a89984"

# Left — just a one-cell margin before the window tabs. The session name
# (#S) used to sit here, but sessions are never named, so it only ever
# showed tmux's session counter.
#
# After the margin: a count of agents flagged in sessions that are *not on
# screen* — orange ✋N blocked on me, grey ●N finished — and nothing at all
# when there are none. The pills only cover the session I'm attached to; this
# covers the rest. Each @hidden_* format expands to one "x" per matching
# window in sessions with no attached client, and #{n:…} counts them. Pure
# format, so it redraws the moment the hook sets @claude_waiting: no #() job
# and no dependence on status-interval.
set -g @hidden_ask  "#{S:#{?session_attached,,#{W:#{?#{==:#{@claude_waiting},ask},x,}}}}"
set -g @hidden_done "#{S:#{?session_attached,,#{W:#{?#{==:#{@claude_waiting},done},x,}}}}"
set -g status-left-length 40
set -g status-left " #{?#{n:#{E:@hidden_ask}},#[fg=#fe8019]✋#{n:#{E:@hidden_ask}} ,}#{?#{n:#{E:@hidden_done}},#[fg=#a89984]●#{n:#{E:@hidden_done}} ,}"

# Windows — pill tabs: inactive sit on a dark pill (bg1), the active
# window wears a blue pill (#83a598) with dark, bold text. The index
# is tinted a shade away from the name so it reads as a label.
# The trailing conditional renders @claude_waiting, set per-window by the
# Claude Code hook local-config/hooks/tmux-agent-flag.sh: ✋ = an agent is
# blocked on you (orange on inactive pills), ● = it finished and is idle.
# The pills have rounded ends: Nerd Font half-circles (U+E0B6 / U+E0B4, which
# ghostty ships built in) drawn in the pill colour on the bar colour. The
# caps carry nounderscore because tmux 3.8 underlines the current window by
# default (window-status-current-style) and a line under the curve looks wrong.
set -g window-status-separator " "
set -g window-status-format         "#[fg=#3c3836,bg=#282828]#[fg=#928374,bg=#3c3836]#I #[fg=#a89984]#W#{?#{==:#{@claude_waiting},ask}, #[fg=#fe8019]✋,#{?#{==:#{@claude_waiting},done}, #[fg=#a89984]●,}}#[fg=#3c3836,bg=#282828]"
set -g window-status-current-format "#[fg=#83a598,bg=#282828,nounderscore]#[default]#[fg=#282828,bg=#83a598,bold]#I #[fg=#1d2021]#W#{?#{==:#{@claude_waiting},ask}, #[fg=#282828]✋,#{?#{==:#{@claude_waiting},done}, #[fg=#282828]●,}}#[default]#[fg=#83a598,bg=#282828,nounderscore]"
set -g window-status-activity-style "fg=#fe8019,bg=#3c3836"

# Right — battery · kube context · wakatime · connection · date
# #{battery_percentage} is substituted by the tmux-battery plugin. The time
# remaining is NOT: that plugin's #{battery_remain} renders "+inf:-nan:-nan" on
# every Linux host with more than one power supply, so ~/bin/battery-remain.sh
# replaces it (the script header documents the two upstream bugs).
set -g status-right-length 250
# uv by absolute path: #() runs with the tmux *server's* environment, which can
# predate shell PATH changes (uv lives in the nix profile, not homebrew).
set -g status-right "#[fg=#928374] Batt #{battery_percentage} #(~/bin/battery-remain.sh) #[fg=#665c54]│ #[fg=#928374]#(~/.completions/tmux_kube.sh) #[fg=#665c54]│ #[fg=#928374]Wakatime #(cd ~/bin; ~/.nix-profile/bin/uv run view.py today) #[fg=#665c54]│ #[fg=#928374]Conn #(cd ~/bin; ~/.nix-profile/bin/uv run connection-checker.py --tmux) #[fg=#665c54]│ #[fg=#a89984]%a %d %b %H:%M "

# Panes — subtle borders, gray (not coloured) active border
set -g pane-border-style           "fg=#3c3836"
set -g pane-active-border-style    "fg=#a89984"
set -g display-panes-colour        "#504945"
set -g display-panes-active-colour "#a89984"

# Dim panes without focus: their default-coloured text drops to fg4 while the
# focused pane keeps the theme foreground (fg1). window-active-style has to
# name that colour — left at default it inherits window-style and dims too.
set -g window-style        "fg=#a89984"
set -g window-active-style "fg=#ebdbb2"

# Popups (prefix + f, prefix + g). tmux 3.8 gives popups their own look by
# default — a dark grey background with white text — so a program in one does
# not sit on the terminal's colours: lazygit in the popup was on a different
# background from ghostty and nvim. Pin them to the theme's bg0 / fg1, with
# the border in the same gray and shape as the active pane border.
set -g popup-style        "bg=#282828,fg=#ebdbb2"
set -g popup-border-style "bg=#282828,fg=#a89984"
set -g popup-border-lines rounded

# Messages / command prompt
set -g message-style         "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Copy-mode selection highlight
set -g mode-style "bg=#504945,fg=#ebdbb2"

# Clock (prefix + t)
set -g clock-mode-colour "#a89984"
