# Minimal ranger config - only customizations, defaults handled by ranger

# Display
set show_hidden true
set vcs_aware true
set status_bar_on_top true
set draw_borders both
set dirname_in_tabs true
set update_tmux_title false

# Custom directory shortcuts
map cdw cd ~/Documents/workarea
map cdi cd ~/Documents/workarea/cloud-platform-infrastructure
map cde cd ~/Documents/workarea/cloud-platform-environments

