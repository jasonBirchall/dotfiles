# Minimal ranger config - only customizations, defaults handled by ranger

# Display
set show_hidden true
set vcs_aware true
set status_bar_on_top true
set draw_borders both
set dirname_in_tabs true
set update_tmux_title false

# Custom directory shortcuts
map cdw cd ~/Documents/workarea
map cdi cd ~/Documents/workarea/cloud-platform-infrastructure
map cde cd ~/Documents/workarea/cloud-platform-environments

# C — quit, and leave the shell I started ranger from in the directory I am
# looking at. q still quits without moving the shell.
# A program cannot change its parent shell's directory, so this is half of a
# pair: the `ranger` shell function (modules/shell.nix) passes a temp file in
# $RANGER_CD_FILE, this writes the directory into it, and the function cds
# there once ranger has exited. Started some other way (no function, so no
# variable) C is a plain quit.
# %d is the current directory, already shell-quoted by ranger; %% is a
# literal %. No ";" in the shell command: chain splits on it.
map C chain shell -s [ -z "$RANGER_CD_FILE" ] || printf %%s %d > "$RANGER_CD_FILE"; quitall
