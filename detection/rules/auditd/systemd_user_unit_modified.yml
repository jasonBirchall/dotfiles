title: Systemd User Unit Created Or Modified
id: 51a5a698-a424-4586-bbfd-4b432ef59d04
status: experimental
description: >
  Write into ~/.config/systemd/user (systemd-user-tamper watch). A user
  service or timer survives reboots without root, making this a favoured
  persistence spot. Fires on everything except systemd itself and the
  home-manager provisioning path.
references:
  - https://attack.mitre.org/techniques/T1543/002/
author: Jason Birchall
date: 2026-07-24
tags:
  - attack.persistence
  - attack.t1543.002
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: SYSCALL
    key: systemd-user-tamper
  filter_expected_tools:
    comm:
      - systemd
      - systemctl
      - home-manager
      - nix
      - ln
  condition: selection and not filter_expected_tools
falsepositives:
  - Editing a unit by hand with an editor, or an app installing its own
    user service (e.g. flatpak portals)
level: medium
