[Unit]
# Only run the IDS on AC power — packet inspection keeps the CPU from idling
# and is a constant battery cost. Conditions are checked at start time, so this
# prevents a boot-on-battery from starting Suricata. The companion udev rule
# (99-suricata-acpower.rules) handles dynamic start/stop when AC is plugged or
# unplugged while the machine is running.
ConditionACPower=true
